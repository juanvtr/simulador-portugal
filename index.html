<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Portugal 2027</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4 font-sans antialiased">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6 mt-4">
        
        <div class="mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-slate-800">Plano Portugal</h1>
            <p class="text-slate-500 text-sm">Simulação e Controle de Caixa</p>
        </div>

        <div class="mb-5">
            <label class="block text-sm font-semibold text-slate-700 mb-1">Renda Líquida Combinada (R$)</label>
            <input type="number" id="renda" value="6900" oninput="calcularSobra()" 
                   class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors text-lg font-medium text-slate-700">
        </div>

        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Aluguel + Condomínio (R$)</label>
                <input type="number" id="aluguel" value="2500" oninput="calcularSobra()" 
                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-400 focus:bg-white text-red-600 font-medium transition-colors">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Parcela Fox (R$)</label>
                <input type="number" id="carro" value="1000" oninput="calcularSobra()" 
                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-400 focus:bg-white text-red-600 font-medium transition-colors">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Fatura Cartão (R$)</label>
                <input type="number" id="cartao" value="1200" oninput="calcularSobra()" 
                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-400 focus:bg-white text-red-600 font-medium transition-colors">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Comentários do Mês</label>
                <textarea id="comentarios" rows="2" placeholder="Ex: Gasto extra com prancha..." 
                          class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors text-sm text-slate-700"></textarea>
            </div>
        </div>

        <div class="bg-blue-600 p-5 rounded-xl text-white shadow-inner mb-4">
            <h2 class="text-blue-100 font-medium text-sm">Sobra Mensal Projetada</h2>
            <div class="flex items-baseline mt-1">
                <span class="text-xl mr-1">R$</span>
                <span id="resultadoSobra" class="text-4xl font-bold tracking-tight">2200.00</span>
            </div>
            
            <div class="mt-3 pt-3 border-t border-blue-500 flex justify-between text-sm">
                <span class="text-blue-100">Em 10 meses:</span>
                <span class="font-bold">R$ <span id="projecaoDezMeses">22000.00</span></span>
            </div>
        </div>

        <button onclick="salvarNoSheets()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 px-4 rounded-xl transition-colors">
            Salvar Cenário (Google Sheets)
        </button>
    </div>

    <script>
        function calcularSobra() {
            const renda = Number(document.getElementById('renda').value) || 0;
            const aluguel = Number(document.getElementById('aluguel').value) || 0;
            const carro = Number(document.getElementById('carro').value) || 0;
            const cartao = Number(document.getElementById('cartao').value) || 0;

            const despesas = aluguel + carro + cartao;
            const sobra = renda - despesas;
            const projecao = sobra * 10;

            document.getElementById('resultadoSobra').innerText = sobra.toFixed(2);
            document.getElementById('projecaoDezMeses').innerText = projecao.toFixed(2);
        }

        function salvarNoSheets() {
            const dados = {
                renda: document.getElementById('renda').value,
                aluguel: document.getElementById('aluguel').value,
                carro: document.getElementById('carro').value,
                cartao: document.getElementById('cartao').value,
                sobra: document.getElementById('resultadoSobra').innerText,
                comentarios: document.getElementById('comentarios').value
            };

            // Para conectar com o Google Sheets no futuro, basta gerar um Webhook no Google Apps Script e colar a URL abaixo.
            const webhookUrl = 'SUA_URL_DO_GOOGLE_APPS_SCRIPT_AQUI';
            
            if (webhookUrl === 'SUA_URL_DO_GOOGLE_APPS_SCRIPT_AQUI') {
                alert("Simulação concluída! Para enviar os dados reais, insira a URL do seu Google Apps Script no código.");
                console.log("Dados que seriam enviados:", dados);
                return;
            }

            fetch(webhookUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            }).then(() => {
                alert('Cenário salvo na planilha com sucesso!');
                document.getElementById('comentarios').value = '';
            }).catch(err => {
                alert('Erro ao salvar.');
                console.error(err);
            });
        }

        calcularSobra();
    </script>
</body>
</html>
